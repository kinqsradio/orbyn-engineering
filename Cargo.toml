[workspace]
resolver = "3"
exclude = ["desktop/src-tauri"]
members = ["crates/orbyn-contracts", "crates/orbyn-core", "crates/orbynd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "11", features = ["serde-json-impl"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
