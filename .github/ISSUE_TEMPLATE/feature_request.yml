name: Feature request
description: Propose a feature or a change to how the app behaves.
title: "feat: "
labels:
  - enhancement
  - needs triage
body:
  - type: markdown
    attributes:
      value: "Title as `feat(scope): what it adds`. Keep it short: bullets and fragments, under about 150 words. Features come from docs/parity.md; anything not on it needs the maintainer's agreement before work starts."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One line on what a user can do afterwards, and one on why it matters.
    validations:
      required: true
  - type: input
    id: row
    attributes:
      label: Parity rows
      description: Row IDs in docs/parity.md, or "none".
      placeholder: I40, I41
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      description: One line per task, under 12 words, starting with a verb, with the parity row in brackets. Detail goes in the linked doc or PR, not under the box.
      value: |
        - [ ] Refresh the model list from the installed engine (I40)
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: One or two lines on what has to be true and how it is shown, such as the real service on both platforms.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Core
        - Contracts
        - Service and CLI
        - Web UI
        - Desktop
        - Skills library
        - CI and release
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options:
        - macOS
        - Windows
    validations:
      required: true
  - type: dropdown
    id: ai-used
    attributes:
      label: AI usage
      options:
        - Human only
        - AI helped
    validations:
      required: true
  - type: input
    id: ai-details
    attributes:
      label: AI details
      description: If AI helped, the harness and version, each model by exact ID and what it did, and the effort.
      placeholder: Claude Code 2.1.150, claude-opus-5-5 (reproduced it), medium
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
