name: Feature request
description: Propose a feature or a change to how the app behaves.
title: "feat: "
labels:
  - enhancement
  - needs triage
body:
  - type: markdown
    attributes:
      value: "Title as `feat(scope): what it adds`. Features come from docs/parity.md; anything not on it needs the maintainer's agreement before work starts."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What a user can do afterwards that they cannot do today, and why it matters.
    validations:
      required: true
  - type: input
    id: row
    attributes:
      label: Parity rows
      description: Row IDs in docs/parity.md, or "none".
      placeholder: I40, I41
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      description: One line per task. Start with what to do in plain words, then the parity row in brackets, so a maintainer knows what it is without looking it up.
      value: |
        - [ ] **Show the engine's real model list, and let people refresh it.** Read it from the installed engine and recover when refresh fails. (I40)
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: What has to be true, and how it is shown, such as through the real service or on both platforms.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Core
        - Contracts
        - Service and CLI
        - Web UI
        - Desktop
        - Skills library
        - CI and release
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options:
        - macOS
        - Windows
    validations:
      required: true
  - type: dropdown
    id: ai-used
    attributes:
      label: AI usage
      options:
        - Human only
        - AI helped
    validations:
      required: true
  - type: input
    id: ai-details
    attributes:
      label: AI details
      description: If AI helped, the harness and version, each model by exact ID and what it did, and the effort.
      placeholder: Claude Code 2.1.150, claude-opus-5-5 (reproduced it), medium
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
