name: Documentation
description: Something in the documentation is missing, wrong or out of date.
title: "docs: "
labels:
  - documentation
  - needs triage
body:
  - type: markdown
    attributes:
      value: |
        The title starts with the kind of change this will take, in the form
        `type(scope): summary`, such as `docs: the release steps name an old script`.
        Kinds: feat, fix, docs, test, refactor, perf, build, ci, chore, style,
        revert, and question for an issue that only asks something.
  - type: input
    id: page
    attributes:
      label: Page or section
      description: The file or heading that is wrong, with a link when you have one.
      placeholder: docs/architecture.md, "Renders"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the text as it reads now, and say what it should say instead.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: What you checked
      description: The code, command output or page you read that shows the current text is wrong.
  - type: dropdown
    id: ai-usage
    attributes:
      label: AI usage
      description: Whether AI helped you find or write this.
      options:
        - Human only
        - AI helped
    validations:
      required: true
  - type: textarea
    id: ai-details
    attributes:
      label: AI details
      description: If AI helped, the harness and version, every model by exact ID and what it did, and the effort level. Leave empty for "Human only".
      placeholder: Claude Code 2.1.150, claude-opus-5-5 (found the stale steps), medium
