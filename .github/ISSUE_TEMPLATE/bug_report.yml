name: Bug report
description: Something in the app does not work as it should.
title: "fix: "
labels:
  - bug
  - needs triage
body:
  - type: markdown
    attributes:
      value: "Title as `fix(scope): what is wrong`. Keep it short: bullets and fragments, under about 150 words. No tokens, credentials or personal data; report vulnerabilities privately, as SECURITY.md describes."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What goes wrong, in one line.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a throwaway project and synthetic data.
      placeholder: |
        1. Add a project
        2. Start a thread with ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      description: The app version from Settings, or the commit you built.
      placeholder: 45a952b
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - macOS
        - Windows
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      multiple: true
      options:
        - Desktop app
        - Browser
        - Command line
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      multiple: true
      options:
        - Claude
        - Codex
        - ACP agent
        - AG-UI agent
        - Terminal
        - Not engine related
    validations:
      required: true
  - type: input
    id: engine-version
    attributes:
      label: Engine version
      placeholder: claude --version, or codex --version
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Only the lines that show the error, with secrets removed. Link a long log instead of pasting it.
      render: text
  - type: dropdown
    id: ai-used
    attributes:
      label: AI usage
      options:
        - Human only
        - AI helped
    validations:
      required: true
  - type: input
    id: ai-details
    attributes:
      label: AI details
      description: If AI helped, the harness and version, each model by exact ID and what it did, and the effort.
      placeholder: Claude Code 2.1.150, claude-opus-5-5 (reproduced it), medium
