name: Label pull request
# Runs the labeler from main with the base repository's token. It reads only the
# list of changed paths and never checks out or runs pull request code, which is
# what makes pull_request_target safe here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  label:
    name: Label by area
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false
