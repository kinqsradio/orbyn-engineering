name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - name: Generated wire types are committed
        shell: bash
        run: |
          git add --intent-to-add web/src/generated
          git diff --exit-code --stat -- web/src/generated

  web:
    name: Web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: cargo build -p orbynd --bin orbynd --bin orbyn-fake-engine
      - run: npm run test:e2e:install
        working-directory: web
      - name: System libraries for the headless shell
        run: sudo npx playwright install-deps chromium-headless-shell
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - name: Keep failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: web/test-results
          retention-days: 7

  desktop:
    name: Unsigned desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundles: app
          - os: windows-2022
            bundles: nsis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            .
            desktop/src-tauri
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npm run prepare-bundle
        working-directory: desktop
      - run: npx tauri build --bundles ${{ matrix.bundles }}
        working-directory: desktop
      - name: Release script tests
        shell: bash
        run: node --test scripts/release-evidence.test.mjs scripts/smoke-service.test.mjs scripts/smoke-app-diagnostics.test.mjs scripts/smoke-app-environment.test.mjs scripts/smoke-app-providers.test.mjs scripts/verify-macos-release.test.mjs scripts/install.test.mjs
      - name: Load the packaged service
        shell: bash
        run: node scripts/smoke-package.mjs
      - name: Shell tests
        shell: bash
        working-directory: desktop/src-tauri
        run: cargo test
      - name: Install and start the app
        shell: bash
        run: node scripts/smoke-app.mjs
      - name: Keep the bundle for packaged qualification
        shell: bash
        # Relative paths: Windows tar reads a drive letter as a remote host.
        working-directory: desktop/src-tauri/target/release
        run: tar -cf ../../../../bundle.tar bundle/${{ matrix.bundles == 'app' && 'macos' || 'nsis' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.os }}
          path: bundle.tar
          retention-days: 1

  # Not required: it depends on a published Codex release. The installed app runs
  # against that real Codex, signed out, under the same private profile.
  packaged:
    name: Packaged app with signed-out Codex (${{ matrix.os }})
    needs: desktop
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            codex: codex
          - os: windows-2022
            codex: codex.cmd
    env:
      CODEX_VERSION: 0.166.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-${{ matrix.os }}
          path: ${{ runner.temp }}
      - name: Unpack the bundle
        shell: bash
        working-directory: ${{ runner.temp }}
        run: mkdir -p release && tar -xf bundle.tar -C release
      - name: Install Codex without its install scripts
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/codex" --no-save --no-audit --no-fund --ignore-scripts "@openai/codex@$CODEX_VERSION"
      - name: Install and start the app with a signed-out Codex
        shell: bash
        env:
          ORBYN_SMOKE_CODEX_BIN: ${{ runner.temp }}/codex/node_modules/.bin/${{ matrix.codex }}
        run: node scripts/smoke-app.mjs "$RUNNER_TEMP/release/bundle"
