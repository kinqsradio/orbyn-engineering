[package]
name = "orbynd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "orbynd"
path = "src/main.rs"

# Deterministic protocol double used by the integration tests. It speaks each
# engine's wire format over real pipes and is never selected by default.
[[bin]]
name = "orbyn-fake-engine"
path = "src/bin/orbyn_fake_engine.rs"

[dependencies]
orbyn-contracts = { path = "../orbyn-contracts" }
orbyn-core = { path = "../orbyn-core" }
axum.workspace = true
clap.workspace = true
futures-util.workspace = true
getrandom.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
tokio-tungstenite.workspace = true
